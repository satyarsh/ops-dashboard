# Server inventory: [groups], [group:vars], [all:vars], per-host overrides.
# No hosts are enabled until you add/uncomment them. Omitted options use SSH config.
[servers]
# supervisord
web01 host=10.10.2.10 user=goody port=2222
# db01 host=10.10.2.20 user=admin port=22022 identity_file=~/.ssh/db_key

[all:vars]
# Default: sudo -n /usr/local/libexec/ops-dashboard-collect 24
# Install the collector on each server; no collector_command setting is needed.
# Optional override for a root SSH account (the app adds the lookback hours):
# collector_command="/usr/local/libexec/ops-dashboard-collect"

# Supervisor stays disabled until server= names an active entry above.
# Example: add jobs host=192.0.2.10 user=monitor port=2222 under [servers].
[supervisor]
server=jobs
command="sudo -n supervisorctl status"
interval=120
enabled=true
