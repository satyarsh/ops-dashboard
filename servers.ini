# Ansible inventory used by the dashboard and ansible/setup.yml.
# Connection values may be omitted when already defined in ~/.ssh/config.
[servers]
#supervisor ansible_host=10.10.2.20 ansible_user=admin ansible_port=2223 ansible_ssh_private_key_file='~/.ssh/db_key'
vm1 ansible_host=192.168.100.243 ansible_user=sat ansible_port=22
vm2 ansible_host=192.168.100.242 ansible_user=sat ansible_port=22

# Monitoring only: excluded from Ansible setup, access scans and resource scans.
# Put one server here to enable the Supervisor panel.
[supervisor_hosts]
supervisor ansible_host=192.168.100.242 ansible_user=sat ansible_port=22

[supervisor_hosts:vars]
supervisor_command=sudo -n supervisorctl status
supervisor_interval=120
supervisor_enabled=true

[all:vars]
ansible_python_interpreter=auto_silent
# collector_command=sudo -n /usr/local/libexec/ops-dashboard-collect
